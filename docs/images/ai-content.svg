<title id="title">Conceptual AI content workflow</title><desc id="desc">Topic and audience flow through an AI provider into reviewed tweet drafts.</desc><rect width="900" height="300" fill="#f7fafc"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="40" y="105" width="180" height="90" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="130" y="145" font-size="18" fill="#1e3a8a">Goal + context</text><text x="130" y="170" font-size="14" fill="#1e3a8a">topic · audience · tone</text><path d="M220 150h90" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="310" y="105" width="180" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="400" y="145" font-size="18" fill="#14532d">AI provider</text><text x="400" y="170" font-size="14" fill="#14532d">draft + alternatives</text><path d="M490 150h90" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="580" y="105" width="180" height="90" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="670" y="145" font-size="18" fill="#7c2d12">Human review</text><text x="670" y="170" font-size="14" fill="#7c2d12">safety + approval</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs></svg>
