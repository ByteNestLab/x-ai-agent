<title id="title">Conceptual X analytics workflow</title><desc id="desc">Platform metrics become an engagement report that feeds back into planning.</desc><rect width="900" height="300" fill="#f8fafc"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="45" y="105" width="180" height="90" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="135" y="145" font-size="18" fill="#78350f">X metrics</text><text x="135" y="170" font-size="14" fill="#78350f">reach · likes · replies</text><path d="M225 150h90" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><rect x="315" y="105" width="180" height="90" rx="12" fill="#cffafe" stroke="#0891b2"/><text x="405" y="145" font-size="18" fill="#164e63">Analytics</text><text x="405" y="170" font-size="14" fill="#164e63">rate + report</text><path d="M495 150h90" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><rect x="585" y="105" width="180" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="675" y="145" font-size="18" fill="#4c1d95">Feedback</text><text x="675" y="170" font-size="14" fill="#4c1d95">improve next plan</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#475569"/></marker></defs></svg>
