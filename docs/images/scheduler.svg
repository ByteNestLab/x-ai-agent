<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Conceptual X post scheduler workflow</title><desc id="desc">Approved content enters a queue, waits for a timezone-aware time, then reaches an adapter.</desc><rect width="900" height="300" fill="#fff7ed"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="45" y="105" width="180" height="90" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="135" y="145" font-size="18" fill="#7f1d1d">Approved draft</text><text x="135" y="170" font-size="14" fill="#7f1d1d">content + policy check</text><path d="M225 150h90" stroke="#78716c" stroke-width="4" marker-end="url(#a)"/><rect x="315" y="105" width="180" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="405" y="145" font-size="18" fill="#312e81">Queue</text><text x="405" y="170" font-size="14" fill="#312e81">timezone + retry</text><path d="M495 150h90" stroke="#78716c" stroke-width="4" marker-end="url(#a)"/><rect x="585" y="105" width="180" height="90" rx="12" fill="#d1fae5" stroke="#059669"/><text x="675" y="145" font-size="18" fill="#064e3b">X Adapter</text><text x="675" y="170" font-size="14" fill="#064e3b">publish or report</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#78716c"/></marker></defs></svg>
